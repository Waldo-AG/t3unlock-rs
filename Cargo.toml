[package]
name = "t3unlock"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Cross-platform CLI to unlock Samsung Portable SSD T1/T3/T5"
repository = "https://github.com/Foxtrot-Zulu/t3unlock-rs"
keywords = ["usb", "samsung", "ssd", "t3", "portable-ssd"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
rusb = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
rpassword = "7"
atty = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "t3unlock"
path = "src/main.rs"
